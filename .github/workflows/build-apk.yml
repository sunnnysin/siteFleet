name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'yarn'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Write .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK to Google Drive
        run: |
          set -euo pipefail

          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}' > gdrive-key.json

          sudo apt-get update
          sudo apt-get install -y rclone

          rclone config create gdrive drive --non-interactive \
            service_account_file=gdrive-key.json \
            scope=drive

          apk_name="SiteFleet-$(date +%d-%m-%Y).apk"

          rclone copyto \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "gdrive:${apk_name}" \
            --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}"

      - name: Remove Google Drive service account key
        if: always()
        run: rm -f gdrive-key.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: Automated debug build from commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
