name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'yarn'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Write .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK to Google Drive
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
        run: |
          set -euo pipefail

          mkdir -p ~/.config/rclone
          printf '%s\n' "$GDRIVE_RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

          sudo apt-get update
          sudo apt-get install -y rclone

          apk_name="SiteFleet-$(date +%d-%m-%Y).apk"

          rclone copyto \
            android/app/build/outputs/apk/release/app-release.apk \
            "gdrive:${apk_name}" \
            --drive-root-folder-id "${{ secrets.GDRIVE_FOLDER_ID }}"

      - name: Remove Google Drive rclone config
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: Automated debug build from commit ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/app-release.apk
